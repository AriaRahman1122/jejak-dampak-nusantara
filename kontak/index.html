<!doctype html>
<html lang="id" data-theme="light" data-base-path="..">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontak | Jejak Dampak Nusantara</title>
  <meta name="description" content="Hubungi Jejak Dampak Nusantara untuk donasi, kemitraan, dan konsultasi program.">
  <link rel="icon" href="../assets/img/logo-mark.svg" type="image/svg+xml">
  <script>
    (function () {
      const theme = localStorage.getItem('jdn-theme');
      const lang = localStorage.getItem('jdn-lang');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
      if (lang) document.documentElement.setAttribute('lang', lang);
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/contact.css">
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <div id="navbar-container"></div>
  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow green" data-i18n="contact-eyebrow">Kontak</span>
        <h1 data-i18n="contact-title">Mari berkolaborasi</h1>
        <p data-i18n="contact-desc">Sampaikan kebutuhan donasi, kemitraan CSR, atau konsultasi program Anda.</p>
      </div>
    </section>
    <section class="section">
      <div class="container contact-layout">
        <aside class="contact-card">
          <span class="eyebrow green" data-i18n="official-contact">Kontak Resmi</span>
          <h2>Asep Nugraha</h2>
          <p class="contact-role">Founder &amp; CEO</p>
          <div class="contact-details">
            <a href="tel:087735524614">087735524614</a>
            <a href="mailto:asepnugraha@jejakdampak.org">asepnugraha@jejakdampak.org</a>
            <span>Bandung, Jawa Barat</span>
          </div>
        </aside>
        <form class="contact-form form-panel" id="contactForm">
          <div class="section-head">
            <span class="eyebrow green" data-i18n="contact-form-eyebrow">Kirim Pesan</span>
            <h2 data-i18n="contact-form-title">Ceritakan kebutuhan Anda</h2>
          </div>
          <div class="form-grid">
            <label><span data-i18n="form-name">Nama</span><input class="input" name="name" required autocomplete="name"></label>
            <label><span data-i18n="form-email">Email</span><input class="input" name="email" type="email" required autocomplete="email"></label>
            <label><span data-i18n="form-phone">WhatsApp</span><input class="input" name="phone" type="tel" autocomplete="tel"></label>
            <label><span data-i18n="form-topic">Topik</span><select class="input" name="topic"><option value="donasi" data-i18n="topic-donation">Donasi</option><option value="csr" data-i18n="topic-csr">Kemitraan CSR</option><option value="program" data-i18n="topic-program">Program Sosial</option><option value="media" data-i18n="topic-media">Media / Berita</option></select></label>
          </div>
          <label><span data-i18n="form-message">Pesan</span><textarea class="input" name="message" rows="6" required></textarea></label>
          <button class="btn" type="submit" data-i18n="send-message">Kirim Pesan</button>
          <p class="form-status" id="contactStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <div id="footer-container"></div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/translations/components.js"></script>
  <script src="../assets/js/translations/contact.js"></script>
  <script src="../assets/js/contact.js"></script>
</body>
</html>
