<!doctype html>
<html data-base-path=".." lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donasi | Jejak Dampak Nusantara</title>
  <meta name="description" content="Campaign Donasi Jejak Dampak Nusantara">
  <link rel="icon" href="../assets/img/logo-mark.svg" type="image/svg+xml">
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('jdn-theme');
      const savedLang = localStorage.getItem('jdn-lang');
      
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
      
      if (savedLang) {
        document.documentElement.setAttribute('lang', savedLang);
      }
    })();
  </script>
  
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/donation.css">
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten</a>

  <div id="navbar-container"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow green" data-i18n="hero-eyebrow">Campaign Donasi</span>
        <h1 data-i18n="hero-title">Pilih campaign yang sedang dibuka.</h1>
        <p data-i18n="hero-desc">Setiap campaign menampilkan target, progres dana, sisa waktu, penerima manfaat, dan update program.</p>
      </div>
    </section>

    <section class="section soft-bg">
      <div class="container">
        <!-- Toolbar -->
        <div class="donation-toolbar">
          <div class="search-wrap">
            <input
              type="search"
              id="campaignSearch"
              placeholder="Cari campaign..."
              data-i18n-placeholder="search-placeholder"
            />
          </div>
          <div class="filter-dropdown" data-filter-dropdown>
            <button type="button" class="btn btn-outline filter-button">
              <span data-i18n="category-label">Kategori</span> <span data-category-count>Semua</span>
            </button>
            <div class="filter-panel" data-category-panel></div>
          </div>
        </div>

        <div class="selected-filters" data-selected-filters></div>

        <div class="result-head">
          <strong><span data-campaign-count>0</span> <span data-i18n="campaign-count-label">campaign</span></strong>
          <span data-i18n="result-hint">klik card untuk melihat detail campaign</span>
        </div>

        <!-- Layout dengan sidebar -->
        <div class="donation-layout">
          <div class="donation-main">
            <div class="campaign-grid" id="campaignGrid">
              <!-- Campaign cards akan di-load oleh JavaScript -->
            </div>
          </div>

          <aside class="donation-sidebar">
            <div class="sidebar-widget">
              <h3 class="sidebar-title" data-i18n="ending-soon">Segera Berakhir</h3>
              <div id="endingSoonList" class="ending-soon-list">
                <!-- Campaign yang segera berakhir akan di-load -->
              </div>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/translations/components.js"></script>
  <script src="../assets/js/translations/donation.js"></script>
  <script src="../assets/js/donation.js"></script>
</body>
</html>
