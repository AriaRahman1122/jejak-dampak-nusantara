<!doctype html>
<html data-base-path=".." lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Program | Jejak Dampak Nusantara</title>
  <meta name="description" content="Temukan program sosial Jejak Dampak Nusantara berdasarkan kategori dan wilayah.">
  <link rel="icon" href="../assets/img/logo-mark.svg" type="image/svg+xml">

  <script>
    (function () {
      const savedTheme = localStorage.getItem("jdn-theme");
      const savedLang = localStorage.getItem("jdn-lang");

      if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }

      if (savedLang) {
        document.documentElement.setAttribute("lang", savedLang);
      }
    })();
  </script>

  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/program.css">
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten</a>

  <div id="navbar-container"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow green" data-i18n="hero-eyebrow">Bank Program</span>
        <h1 data-i18n="hero-title">Temukan program berdasarkan kategori dan wilayah.</h1>
        <p data-i18n="hero-desc">
          Gunakan pencarian, pilih beberapa kategori, lalu tentukan provinsi untuk
          menemukan program yang paling sesuai.
        </p>
      </div>
    </section>

    <section class="section program-section" aria-labelledby="program-result-title">
      <div class="container">
        <div class="program-toolbar" aria-label="Filter program">
          <div class="search-wrap">
            <label class="sr-only" for="programSearch">Cari program</label>
            <input
              type="search"
              id="programSearch"
              placeholder="Cari program, kategori, SDGs, provinsi..."
              data-i18n-placeholder="search-placeholder"
              autocomplete="off"
            >
          </div>

          <div class="filter-dropdown" data-category-dropdown>
            <button
              type="button"
              class="filter-button"
              data-category-button
              aria-expanded="false"
              aria-controls="categoryFilterPanel"
            >
              <span class="filter-button-label" data-category-label>Kategori</span>
              <span class="filter-button-value" data-category-count>Semua</span>
            </button>

            <div
              class="filter-panel category-filter-panel"
              id="categoryFilterPanel"
              data-category-panel
              aria-label="Pilihan kategori"
            ></div>
          </div>

          <div class="filter-dropdown" data-province-dropdown>
            <button
              type="button"
              class="filter-button"
              data-province-button
              aria-expanded="false"
              aria-controls="provinceFilterPanel"
            >
              <span class="filter-button-label" data-province-label>Provinsi</span>
              <span class="filter-button-value" data-province-value>Semua</span>
            </button>

            <div
              class="filter-panel province-filter-panel"
              id="provinceFilterPanel"
              data-province-panel
              role="radiogroup"
              aria-label="Pilihan provinsi"
            ></div>
          </div>
        </div>

        <div class="selected-filters" data-selected-filters aria-live="polite"></div>

        <div class="result-head" id="program-result-title">
          <strong>
            <span data-program-count>0</span>
            <span data-i18n="program-count-label">program</span>
          </strong>
          <span data-i18n="result-hint">Klik kartu untuk melihat detail program</span>
        </div>

        <div class="program-grid" id="programGrid" aria-live="polite"></div>
      </div>
    </section>

    <div class="modal" id="programModal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="programModalTitle"
      >
        <button
          class="modal-close"
          type="button"
          data-close-modal
          aria-label="Tutup detail program"
        >
          ×
        </button>
        <div id="programModalContent"></div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/translations/components.js"></script>
  <script src="../assets/js/translations/program.js"></script>
  <script src="../assets/js/program.js"></script>
</body>
</html>
